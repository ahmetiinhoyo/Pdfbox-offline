<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDFBox Offline — PDF Tools</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main>
    <div class="lang-switch">
      <button data-lang="tr" title="Türkçe">TR</button>
<button data-lang="en" title="English">ENG</button>
<button data-lang="ru" title="Русский">RU</button>
    </div>

    <header>
      <h1>📦 PDFBox <span>Offline</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </header>

    <section class="card">
      <h2 data-i18n="mergeTitle"></h2>
      <p class="desc" data-i18n="mergeDesc"></p>

      <label class="file-drop" for="files">
        <input type="file" id="files" accept="application/pdf" multiple hidden />
        <span class="drop-icon">⬆️</span>
        <span class="drop-text" data-i18n="dropText"></span>
      </label>

      <ul id="list" class="file-list"></ul>

      <button id="merge" disabled data-i18n="mergeBtn"></button>
    </section>

    <footer>
      <p><span data-i18n="footer"></span> · <a href="https://github.com/ahmetiinhoyo/Pdfbox-offline">GitHub</a></p>
    </footer>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
