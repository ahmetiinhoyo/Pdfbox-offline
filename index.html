<!DOCTYPE html>
<html lang="tr" data-theme="dark" data-accent="blue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDFBox Offline — Merge & Split PDFs Without Uploading</title>
  <meta name="color-scheme" content="dark light" />

  <meta name="description" content="Merge and split PDF files 100% offline in your browser. No uploads, no ads, no tracking. Free and open source PDF toolbox." />
  <meta name="keywords" content="pdf merge, pdf split, offline pdf, private pdf tool, pdf merger, pdf splitter, no upload pdf, free pdf tool" />
  <meta name="author" content="Ahmet (Thorix)" />
  <meta name="robots" content="index, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="PDFBox Offline — Merge & Split PDFs Without Uploading" />
  <meta property="og:description" content="100% offline PDF toolbox. Your files never leave your device. No ads, no tracking, no sign-up." />
  <meta property="og:url" content="https://ahmetiinhoyo.github.io/Pdfbox-offline/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PDFBox Offline — Merge & Split PDFs Without Uploading" />
  <meta name="twitter:description" content="100% offline PDF toolbox. No ads, no tracking, no sign-up." />

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main>
    <div class="top-bar">
      <div class="lang-switch">
        <button data-lang="tr" title="Türkçe">TR</button>
        <button data-lang="en" title="English">ENG</button>
        <button data-lang="ru" title="Русский">RU</button>
      </div>
      <button id="accentBtn" class="icon-btn accent-btn" title="Renk">🎨</button>
      <button id="themeToggle" class="icon-btn" title="Tema">🌙</button>
    </div>

    <header>
      <h1>📦 PDFBox <span>Offline</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </header>

    <!-- ========== BİRLEŞTİR ========== -->
    <section class="card">
      <h2 data-i18n="mergeTitle"></h2>
      <p class="desc" data-i18n="mergeDesc"></p>

      <label class="file-drop" for="files">
        <input type="file" id="files" accept="application/pdf" multiple hidden />
        <span class="drop-icon">⬆️</span>
        <span class="drop-text" data-i18n="dropText"></span>
      </label>

      <ul id="list" class="file-list"></ul>

      <div id="mergeStats" class="merge-stats" hidden>
        <span id="mergeStatsText"></span>
      </div>

      <button id="merge" disabled data-i18n="mergeBtn"></button>
    </section>

    <!-- ========== BÖL ========== -->
    <section class="card">
      <h2 data-i18n="splitTitle"></h2>
      <p class="desc" data-i18n="splitDesc"></p>

      <label class="file-drop" for="splitFile">
        <input type="file" id="splitFile" accept="application/pdf" hidden />
        <span class="drop-icon">✂️</span>
        <span class="drop-text" id="splitDropText" data-i18n="splitDropText"></span>
      </label>

      <div id="splitActions" class="split-actions" hidden>
        <button id="splitPreviewBtn" class="preview-trigger">
          👁 <span data-i18n="previewBtn"></span>
        </button>
      </div>

      <div class="range-block">
        <label for="pageRange" class="range-label" data-i18n="splitRangeLabel"></label>
        <input
          type="text"
          id="pageRange"
          class="range-input"
          placeholder="örn: 1-3, 5, 7-9"
          autocomplete="off"
        />
        <p class="range-hint" data-i18n="splitRangeHint"></p>
      </div>

      <button id="split" disabled data-i18n="splitBtn"></button>
    </section>

    <!-- ========== METADATA TEMİZLE ========== -->
    <section class="card">
      <h2 data-i18n="metaTitle"></h2>
      <p class="desc" data-i18n="metaDesc"></p>

      <label class="file-drop" for="metaFile">
        <input type="file" id="metaFile" accept="application/pdf" hidden />
        <span class="drop-icon">🧹</span>
        <span class="drop-text" id="metaDropText" data-i18n="metaDropText"></span>
      </label>

      <div id="metaActions" class="split-actions" hidden>
        <button id="metaPreviewBtn" class="preview-trigger">
          👁 <span data-i18n="previewBtn"></span>
        </button>
      </div>

      <div id="metaInfo" class="meta-info" hidden></div>

      <button id="metaBtn" disabled data-i18n="metaBtn"></button>
    </section>

    <!-- ========== FOOTER ========== -->
    <footer>
      <p class="footer-line">
        <span data-i18n="footer"></span>
      </p>
      <div class="footer-links">
        <a href="https://www.buymeacoffee.com/Thorix" target="_blank" rel="noopener" class="footer-btn coffee">
          ☕ <span data-i18n="buyCoffee"></span>
        </a>
        <a href="https://github.com/ahmetiinhoyo/Pdfbox-offline" target="_blank" rel="noopener" class="footer-btn">
          ⭐ <span data-i18n="giveStar"></span>
        </a>
        <a href="https://github.com/ahmetiinhoyo/Pdfbox-offline/issues" target="_blank" rel="noopener" class="footer-btn">
          💬 <span data-i18n="feedback"></span>
        </a>
      </div>
    </footer>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <!-- ========== ÖNİZLEME MODAL ========== -->
  <div id="previewModal" class="preview-modal" hidden>
    <div class="preview-backdrop" id="previewBackdrop"></div>
    <div class="preview-content">
      <div class="preview-header">
        <button id="previewBack" class="preview-back" hidden aria-label="Back">←</button>
        <span id="previewTitle" class="preview-title"></span>
        <button id="previewClose" class="preview-close" aria-label="Close">✕</button>
      </div>

      <!-- Thumbnail grid görünümü -->
      <div id="previewGrid" class="preview-pages"></div>

      <!-- Tek sayfa tam ekran görünümü -->
      <div id="previewViewer" class="preview-viewer" hidden>
        <button id="viewerPrev" class="viewer-nav viewer-prev" aria-label="Previous">‹</button>
        <div class="viewer-canvas-wrap">
          <canvas id="viewerCanvas"></canvas>
        </div>
        <button id="viewerNext" class="viewer-nav viewer-next" aria-label="Next">›</button>
        <div class="viewer-counter">
          <span id="viewerCounter">1 / 1</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
