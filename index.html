<!DOCTYPE html>
<html lang="tr" data-theme="dark" data-accent="blue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDFBox Offline — Merge & Split PDFs Without Uploading</title>
  <meta name="color-scheme" content="dark light" />

  <meta name="description" content="Merge and split PDF files 100% offline in your browser. No uploads, no ads, no tracking. Free and open source PDF toolbox." />
  <meta name="keywords" content="pdf merge, pdf split, offline pdf, private pdf tool, pdf merger, pdf splitter, no upload pdf, free pdf tool" />
  <meta name="author" content="Ahmet (Thorix)" />
  <meta name="robots" content="index, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="PDFBox Offline — Merge & Split PDFs Without Uploading" />
  <meta property="og:description" content="100% offline PDF toolbox. Your files never leave your device. No ads, no tracking, no sign-up." />
  <meta property="og:url" content="https://ahmetiinhoyo.github.io/Pdfbox-offline/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PDFBox Offline — Merge & Split PDFs Without Uploading" />
  <meta name="twitter:description" content="100% offline PDF toolbox. No ads, no tracking, no sign-up." />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- ========== SVG İKON SPRITE ========== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-pages" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></symbol>
      <symbol id="i-package" viewBox="0 0 24 24"><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></symbol>
      <symbol id="i-merge" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
      <symbol id="i-check-circle" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-files" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><polyline points="15 2 15 7 20 7"/></symbol>
    </defs>
  </svg>

  <!-- ========== ÜST BAR ========== -->
  <div class="top-bar">
    <button id="metaToolBtn" class="tool-pill" title="Metadata Temizle">
      <svg class="icon" aria-hidden="true"><use href="#i-eraser"/></svg>
      <span class="tool-pill-label" data-i18n="metaToolBtnLabel"></span>
    </button>

    <div class="top-controls">
      <div class="lang-switch">
        <button data-lang="tr" title="Türkçe">TR</button>
        <button data-lang="en" title="English">EN</button>
        <button data-lang="ru" title="Русский">RU</button>
      </div>
      <div class="accent-wrap">
        <button id="accentBtn" class="icon-btn accent-btn" title="Renk">
          <svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>
        </button>
        <div id="accentMenu" class="accent-menu" hidden>
          <button type="button" class="accent-swatch" data-accent="blue" title="Mavi"><span></span></button>
          <button type="button" class="accent-swatch" data-accent="green" title="Yeşil"><span></span></button>
          <button type="button" class="accent-swatch" data-accent="orange" title="Turuncu"><span></span></button>
          <button type="button" class="accent-swatch" data-accent="pink" title="Pembe"><span></span></button>
        </div>
      </div>
      <button id="themeToggle" class="icon-btn" title="Tema">
        <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
    </div>
  </div>

  <main>
    <header>
      <h1>PDFBox <span>Offline</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="hero-badges" aria-hidden="true">
        <span class="hero-badge"><svg class="icon"><use href="#i-shield"/></svg><span data-i18n="badgeOffline"></span></span>
        <span class="hero-badge"><svg class="icon"><use href="#i-upload"/></svg><span data-i18n="badgeNoUpload"></span></span>
        <span class="hero-badge"><svg class="icon"><use href="#i-package"/></svg><span data-i18n="badgeNoTrack"></span></span>
      </div>
    </header>

    <!-- ========== ARAÇ SEKME BAR ========== -->
    <nav class="tool-nav" id="toolNav" role="tablist" aria-label="Tools">
      <button type="button" class="tool-tab" data-tool="merge" role="tab">
        <svg class="icon" aria-hidden="true"><use href="#i-merge"/></svg>
        <span data-i18n="navMerge"></span>
      </button>
      <button type="button" class="tool-tab" data-tool="split" role="tab">
        <svg class="icon" aria-hidden="true"><use href="#i-split"/></svg>
        <span data-i18n="navSplit"></span>
      </button>
      <button type="button" class="tool-tab" data-tool="images" role="tab">
        <svg class="icon" aria-hidden="true"><use href="#i-image"/></svg>
        <span data-i18n="navImages"></span>
      </button>
      <button type="button" class="tool-tab" data-tool="pages" role="tab">
        <svg class="icon" aria-hidden="true"><use href="#i-pages"/></svg>
        <span data-i18n="navPages"></span>
      </button>
    </nav>

    <!-- ========== ARAÇ PANELLERİ ========== -->
    <div id="toolPanels" class="tool-panels">
    <section class="card tool-panel" id="mergePanel" data-tool="merge">
      <div class="card-head">
        <span class="card-head-icon"><svg class="icon" aria-hidden="true"><use href="#i-merge"/></svg></span>
        <div>
          <h2 data-i18n="mergeTitle"></h2>
          <p class="desc" data-i18n="mergeDesc"></p>
        </div>
      </div>

      <label class="file-drop" for="files">
        <input type="file" id="files" accept="application/pdf" multiple hidden />
        <svg class="drop-icon" aria-hidden="true"><use href="#i-upload"/></svg>
        <span class="drop-text" data-i18n="dropText"></span>
      </label>

      <ul id="list" class="file-list"></ul>

      <div id="mergeStats" class="merge-stats" hidden>
        <span id="mergeStatsText"></span>
      </div>

      <label class="option-checkbox">
        <input type="checkbox" id="mergeCleanMeta" />
        <span class="option-box" aria-hidden="true"><svg class="icon"><use href="#i-check"/></svg></span>
        <span class="option-label" data-i18n="cleanMetaLabel"></span>
      </label>

      <button id="merge" class="primary-btn" disabled data-i18n="mergeBtn"></button>
    </section>

    <!-- ========== BÖL ========== -->
    <section class="card tool-panel" id="splitPanel" data-tool="split" hidden>
      <div class="card-head">
        <span class="card-head-icon"><svg class="icon" aria-hidden="true"><use href="#i-split"/></svg></span>
        <div>
          <h2 data-i18n="splitTitle"></h2>
          <p class="desc" data-i18n="splitDesc"></p>
        </div>
      </div>

      <label class="file-drop" for="splitFile">
        <input type="file" id="splitFile" accept="application/pdf" hidden />
        <svg class="drop-icon" aria-hidden="true"><use href="#i-upload"/></svg>
        <span class="drop-text" id="splitDropText" data-i18n="splitDropText"></span>
      </label>

      <div id="splitActions" class="split-actions" hidden>
        <button id="splitPreviewBtn" class="ghost-btn">
          <svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg>
          <span data-i18n="previewBtn"></span>
        </button>
      </div>

      <div class="range-block">
        <label for="pageRange" class="range-label" data-i18n="splitRangeLabel"></label>
        <input
          type="text"
          id="pageRange"
          class="range-input"
          placeholder="örn: 1-3, 5, 7-9"
          autocomplete="off"
        />
        <p class="range-hint" data-i18n="splitRangeHint"></p>
      </div>

      <label class="option-checkbox">
        <input type="checkbox" id="splitCleanMeta" />
        <span class="option-box" aria-hidden="true"><svg class="icon"><use href="#i-check"/></svg></span>
        <span class="option-label" data-i18n="cleanMetaLabel"></span>
      </label>

      <button id="split" class="primary-btn" disabled data-i18n="splitBtn"></button>
    </section>
    </div><!-- /toolPanels -->

    <!-- ========== FOOTER ========== -->
    <footer>
      <p class="footer-line"><span data-i18n="footer"></span></p>
      <div class="footer-links">
        <a href="https://www.buymeacoffee.com/Thorix" target="_blank" rel="noopener" class="footer-btn coffee">
          <span data-i18n="buyCoffee"></span>
        </a>
        <a href="https://github.com/ahmetiinhoyo/Pdfbox-offline" target="_blank" rel="noopener" class="footer-btn">
          <span data-i18n="giveStar"></span>
        </a>
        <a href="https://github.com/ahmetiinhoyo/Pdfbox-offline/issues" target="_blank" rel="noopener" class="footer-btn">
          <span data-i18n="feedback"></span>
        </a>
      </div>
    </footer>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <!-- ========== ÖNİZLEME MODAL ========== -->
  <div id="previewModal" class="preview-modal" hidden>
    <div class="preview-backdrop" id="previewBackdrop"></div>
    <div class="preview-content">
      <div class="preview-header">
        <button id="previewBack" class="preview-back" hidden aria-label="Back">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg>
        </button>
        <span id="previewTitle" class="preview-title"></span>
        <button id="previewClose" class="preview-close" aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>

      <div id="previewGrid" class="preview-pages"></div>

      <div id="previewViewer" class="preview-viewer" hidden>
        <button id="viewerPrev" class="viewer-nav viewer-prev" aria-label="Previous">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg>
        </button>
        <div class="viewer-canvas-wrap">
          <canvas id="viewerCanvas"></canvas>
        </div>
        <button id="viewerNext" class="viewer-nav viewer-next" aria-label="Next">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg>
        </button>
        <div class="viewer-counter"><span id="viewerCounter">1 / 1</span></div>
      </div>
    </div>
  </div>

  <!-- ========== METADATA TEMİZLEME MODAL ========== -->
  <div id="metaToolModal" class="preview-modal" hidden>
    <div class="preview-backdrop" id="metaToolBackdrop"></div>
    <div class="preview-content meta-tool-content">
      <div class="preview-header">
        <span class="preview-title" data-i18n="metaToolTitle"></span>
        <button id="metaToolClose" class="preview-close" aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>

      <div class="meta-tool-body">
        <p class="meta-tool-desc" data-i18n="metaToolDesc"></p>

        <label class="file-drop" for="metaFile">
          <input type="file" id="metaFile" accept="application/pdf" hidden />
          <svg class="drop-icon" aria-hidden="true"><use href="#i-eraser"/></svg>
          <span class="drop-text" id="metaDropText" data-i18n="metaDropText"></span>
        </label>

        <div id="metaActions" class="split-actions" hidden>
          <button id="metaPreviewBtn" class="ghost-btn">
            <svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg>
            <span data-i18n="previewBtn"></span>
          </button>
        </div>

        <div id="metaInfo" class="meta-info" hidden></div>

        <button id="metaBtn" class="primary-btn" disabled data-i18n="metaBtn"></button>
      </div>
    </div>
  </div>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
